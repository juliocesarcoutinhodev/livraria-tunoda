spring:
  application:
    name: Livraria Tunoda
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT}
          timeout: ${MAIL_SMTP_TIMEOUT}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    br.com.iraquitantunoda.livrariatunoda: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: ERROR
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.melhorenvio: ${LOG_LEVEL_MELHOR_ENVIO:INFO}
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.mercadopago: ${LOG_LEVEL_MERCADO_PAGO:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      environment: production
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  security:
    cookies:
      secure: true  # OBRIGATORIO em producao (HTTPS)
  cors:
    # Production: apenas dominio de producao autorizado
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}
