spring:
  application:
    name: Livraria Tunoda
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:livraria_db}
    username: ${POSTGRES_USER:livraria_user}
    password: ${POSTGRES_PASSWORD:livraria_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    br.com.iraquitantunoda.livrariatunoda: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.melhorenvio: DEBUG
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.mercadopago: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoint:
    health:
      show-details: always  # em local pode mostrar detalhes (db, disk, etc)

app:
  cors:
    # Local: permissivo para desenvolvimento
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:4200,http://127.0.0.1:3000
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    exposed-headers: Authorization
    allow-credentials: true
    max-age: 3600

