spring:
  application:
    name: Livraria Tunoda
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:livraria_db}
    username: ${POSTGRES_USER:livraria_user}
    password: ${POSTGRES_PASSWORD:livraria_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT}
          timeout: ${MAIL_SMTP_TIMEOUT}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    br.com.iraquitantunoda.livrariatunoda: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.melhorenvio: INFO
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.mercadopago: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      environment: staging
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  cors:
    # Staging: apenas dominio de homologacao
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.iraquitantunoda.com.br}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With,X-Correlation-Id}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization,X-Correlation-Id}
    allow-credentials: true
    max-age: 3600
