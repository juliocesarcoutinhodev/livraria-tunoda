spring:
  application:
    name: Livraria Tunoda
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    br.com.iraquitantunoda.livrariatunoda: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.melhorenvio: INFO
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.mercadopago: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

management:
  endpoint:
    health:
      show-details: when-authorized  # staging mostra detalhes apenas para autorizados

app:
  cors:
    # Staging: apenas dominio de homologacao
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://staging.livraria-tunoda.com.br}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With
    exposed-headers: Authorization
    allow-credentials: true
    max-age: 3600

