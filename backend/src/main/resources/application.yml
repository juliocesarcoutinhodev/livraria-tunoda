spring:
  application:
    name: Livraria Tunoda
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

logging:
  level:
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.melhorenvio: DEBUG

management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never  # segurança - não expor detalhes por padrão

melhor-envio:
  base-url: https://sandbox.melhorenvio.com.br
  token: ${MELHOR_ENVIO_TOKEN}
  from-postal-code: ${MELHOR_ENVIO_FROM_CEP:03295-000}
  timeout-seconds: 10
  max-retries: 2
  default-width: 15
  default-height: 2
  default-length: 20

