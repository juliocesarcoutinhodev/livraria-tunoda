spring:
  application:
    name: Livraria Tunoda
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

logging:
  level:
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.melhorenvio: DEBUG
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.mercadopago: DEBUG

management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never  # segurança - não expor detalhes por padrão

melhor-envio:
  base-url: https://sandbox.melhorenvio.com.br
  token: ${MELHOR_ENVIO_TOKEN}
  from-postal-code: ${MELHOR_ENVIO_FROM_CEP:03295-000}
  timeout-seconds: 10
  max-retries: 2
  default-width: 15
  default-height: 2
  default-length: 20

mercado-pago:
  base-url: https://api.mercadopago.com
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN}
  timeout-seconds: 15
  max-retries: 2
  success-url: ${MERCADO_PAGO_SUCCESS_URL:http://localhost:3000/payment/success}
  failure-url: ${MERCADO_PAGO_FAILURE_URL:http://localhost:3000/payment/failure}
  pending-url: ${MERCADO_PAGO_PENDING_URL:http://localhost:3000/payment/pending}
  notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:http://localhost:8080/api/webhooks/mercadopago}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:livraria-tunoda-secret-key-change-in-production-minimum-256-bits-required-for-hs256-algorithm}
      expiration: ${JWT_EXPIRATION:3600}  # 1 hora em segundos
    refresh-token:
      expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}  # 30 dias
