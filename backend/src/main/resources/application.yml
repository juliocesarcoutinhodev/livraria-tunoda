spring:
  application:
    name: Livraria Tunoda
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.melhorenvio: ${LOG_LEVEL_MELHOR_ENVIO:INFO}
    br.com.iraquitantunoda.livrariatunoda.infrastructure.gateway.mercadopago: ${LOG_LEVEL_MERCADO_PAGO:INFO}

management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

melhor-envio:
  base-url: ${MELHOR_ENVIO_BASE_URL:https://sandbox.melhorenvio.com.br}
  token: ${MELHOR_ENVIO_TOKEN}
  from-postal-code: ${MELHOR_ENVIO_FROM_CEP:03295-000}
  timeout-seconds: ${MELHOR_ENVIO_TIMEOUT_SECONDS:10}
  max-retries: ${MELHOR_ENVIO_MAX_RETRIES:2}
  default-width: ${MELHOR_ENVIO_DEFAULT_WIDTH:15}
  default-height: ${MELHOR_ENVIO_DEFAULT_HEIGHT:2}
  default-length: ${MELHOR_ENVIO_DEFAULT_LENGTH:20}
  calculate-endpoint: ${MELHOR_ENVIO_CALCULATE_ENDPOINT:/api/v2/me/shipment/calculate}

mercado-pago:
  base-url: ${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN}
  timeout-seconds: ${MERCADO_PAGO_TIMEOUT_SECONDS:15}
  max-retries: ${MERCADO_PAGO_MAX_RETRIES:2}
  success-url: ${MERCADO_PAGO_SUCCESS_URL:http://localhost:3000/payment/success}
  failure-url: ${MERCADO_PAGO_FAILURE_URL:http://localhost:3000/payment/failure}
  pending-url: ${MERCADO_PAGO_PENDING_URL:http://localhost:3000/payment/pending}
  notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:http://localhost:8080/api/webhooks/mercadopago}
  statement-descriptor: ${MERCADO_PAGO_STATEMENT_DESCRIPTOR:Livraria Tunoda}
  create-preference-endpoint: ${MERCADO_PAGO_CREATE_PREFERENCE_ENDPOINT:/checkout/preferences}
  get-payment-endpoint: ${MERCADO_PAGO_GET_PAYMENT_ENDPOINT:/v1/payments/{id}}

cnpja:
  base-url: ${CNPJA_API_URL:https://api.cnpja.com}
  token: ${CNPJA_API_TOKEN}
  timeout-seconds: ${CNPJA_TIMEOUT_SECONDS:10}
  zip-endpoint: ${CNPJA_ZIP_ENDPOINT:/zip/{code}}

app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:3600}
    refresh-token:
      expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}
