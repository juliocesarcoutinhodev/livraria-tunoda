# =====================================
# Docker Compose para STAGING (SaveInCloud)
# =====================================
# App + Banco juntos para economizar recursos
#
# IMPORTANTE: Defina a variável APP_IMAGE antes de executar:
# export APP_IMAGE=juliocesarcoutinho/livraria-tunoda:staging
# =====================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-staging
    environment:
      POSTGRES_USER: livraria_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livraria_password}
      POSTGRES_DB: livraria_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livraria_user -d livraria_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  app:
    image: ${APP_IMAGE:-juliocesarcoutinho/livraria-tunoda:staging}
    container_name: app-staging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: staging
      SERVER_PORT: 8080

      # Database (usa o serviço postgres acima)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: livraria_db
      POSTGRES_USER: livraria_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livraria_password_staging_123}

      # Security
      JWT_SECRET: ${JWT_SECRET:-chave-jwt-temporaria-staging-minimo-32-caracteres-aqui}
      JWT_EXPIRATION: 3600
      REFRESH_TOKEN_EXPIRATION_DAYS: 30

      # Melhor Envio (Sandbox)
      MELHOR_ENVIO_BASE_URL: https://sandbox.melhorenvio.com.br
      MELHOR_ENVIO_TOKEN: ${MELHOR_ENVIO_TOKEN:-token-temporario}
      MELHOR_ENVIO_FROM_CEP: 03295-000
      MELHOR_ENVIO_TIMEOUT_SECONDS: 10
      MELHOR_ENVIO_MAX_RETRIES: 2
      MELHOR_ENVIO_DEFAULT_WIDTH: 15
      MELHOR_ENVIO_DEFAULT_HEIGHT: 2
      MELHOR_ENVIO_DEFAULT_LENGTH: 20
      MELHOR_ENVIO_CALCULATE_ENDPOINT: /api/v2/me/shipment/calculate

      # Mercado Pago (Sandbox)
      MERCADO_PAGO_BASE_URL: https://api.mercadopago.com
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-token-temporario}
      MERCADO_PAGO_TIMEOUT_SECONDS: 15
      MERCADO_PAGO_MAX_RETRIES: 2
      MERCADO_PAGO_SUCCESS_URL: ${MERCADO_PAGO_SUCCESS_URL:-http://localhost:3000/payment/success}
      MERCADO_PAGO_FAILURE_URL: ${MERCADO_PAGO_FAILURE_URL:-http://localhost:3000/payment/failure}
      MERCADO_PAGO_PENDING_URL: ${MERCADO_PAGO_PENDING_URL:-http://localhost:3000/payment/pending}
      MERCADO_PAGO_NOTIFICATION_URL: ${MERCADO_PAGO_NOTIFICATION_URL:-http://hml-tunoda.sp1.br.saveincloud.net.br/api/webhooks/mercadopago}
      MERCADO_PAGO_STATEMENT_DESCRIPTOR: Livraria Tunoda Staging
      MERCADO_PAGO_CREATE_PREFERENCE_ENDPOINT: /checkout/preferences
      MERCADO_PAGO_GET_PAYMENT_ENDPOINT: /v1/payments/{id}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://hml-tunoda.sp1.br.saveincloud.net.br}
      CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS
      CORS_ALLOWED_HEADERS: Authorization,Content-Type,Accept,Origin,X-Requested-With
      CORS_EXPOSED_HEADERS: Authorization
      CORS_ALLOW_CREDENTIALS: true
      CORS_MAX_AGE: 3600

      # JVM Options
      JAVA_OPTS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError

      # Logging
      LOG_LEVEL_MELHOR_ENVIO: INFO
      LOG_LEVEL_MERCADO_PAGO: INFO

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge

